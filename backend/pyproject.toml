[project]
name = "backend"
version = "0.1.0"
description = "Demonstration API for the Casa Lopez discovery prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi[standard]>=0.143.0",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
