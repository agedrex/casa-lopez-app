name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Run backend tests
        run: uv run --directory backend pytest -q

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: front
      - name: Run frontend lint
        run: pnpm lint
        working-directory: front
      - name: Build frontend
        run: pnpm build
        working-directory: front

  auth-postgres:
    name: Better Auth PostgreSQL verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: front
      - name: Generate and verify Better Auth schema
        run: bash scripts/wo7-ci-postgres.sh
      - name: Upload generated Better Auth schema
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: better-auth-public-schema
          path: ${{ runner.temp }}/better-auth-public.sql
          if-no-files-found: ignore
          retention-days: 7
