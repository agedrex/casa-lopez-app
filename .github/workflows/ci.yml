name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # Disposable database for the integration tests; the credentials are throwaway values, not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_lopez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casa_lopez_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Run backend tests
        # conftest.py applies the Alembic migrations to this database before the integration tests.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/casa_lopez_test
        run: uv run --directory backend pytest -q

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: front
      - name: Run frontend lint
        run: pnpm lint
        working-directory: front
      - name: Build frontend
        run: pnpm build
        working-directory: front
